# ---------------------------------------------------------------------------
# Knowledge Navigator
#
#   docker compose up --build -d          personal stack, host-installed Ollama
#   docker compose down                   stop, keeping knowledge and models
#   docker compose down --volumes         also delete the named volumes
#
# Portable fallback for a machine with no native Ollama:
#   OLLAMA_BASE_URL=http://ollama:11434 OLLAMA_MODEL=qwen3:8b \
#     docker compose --profile container-ollama up --build -d
#
# Only the web port is published, and only on the loopback interface by
# default. The API is reachable exclusively through the web container's /api
# proxy, and the fallback Ollama publishes nothing at all.
# ---------------------------------------------------------------------------

name: knowledge-navigator

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: knowledge-navigator-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # `ollama` by default: the stack expects a model on the host and stays
      # healthy, with browsing and search intact, when there is not one.
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b-mlx}
      ASSISTANT_TIMEOUT_MS: ${ASSISTANT_TIMEOUT_MS:-120000}
      ASSISTANT_CHARACTER_BUDGET: ${ASSISTANT_CHARACTER_BUDGET:-14000}
      DATABASE_PATH: /data/knowledge.db
      CONTENT_PATH: /app/content/concepts
      PORT: '8000'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    volumes:
      - navigator-data:/data
    # Docker Desktop resolves host.docker.internal on its own; Linux engines
    # need it mapped explicitly, so the same host-Ollama configuration works
    # on both.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - navigator
    # The API only reports healthy once content has compiled and the index has
    # opened, so `depends_on: service_healthy` below is a real gate.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: knowledge-navigator-web:local
    restart: unless-stopped
    # The only published port in the stack, on the loopback interface by
    # default. Set BIND_ADDRESS deliberately if this should ever be reachable
    # from another machine — and read the privacy note in the README first.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - navigator
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 10s

  # --- portable fallback ---------------------------------------------------
  # Only starts under `--profile container-ollama`. The ordinary stack uses the
  # host's own Ollama and must never start or pull a duplicate model.
  ollama:
    profiles: ['container-ollama']
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - navigator
    # Deliberately no `ports`: the model API is reachable only from inside this
    # Compose network.
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    stop_grace_period: 20s

  ollama-pull:
    profiles: ['container-ollama']
    image: ollama/ollama:latest
    restart: 'no'
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command: ['ollama pull ${OLLAMA_MODEL:-qwen3:8b}']
    networks:
      - navigator

volumes:
  navigator-data:
  ollama-data:

networks:
  navigator:
    driver: bridge
