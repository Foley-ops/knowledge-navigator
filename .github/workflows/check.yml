# ---------------------------------------------------------------------------
# Continuous integration.
#
# Runs exactly what a person runs locally — `make check`, the browser journeys,
# and both image builds — so a green run here means the same thing as a green
# run on a laptop.
#
# This workflow reads no repository secret and publishes nothing. Images are
# built to prove they build; pushing them is a separate, manual workflow.
# ---------------------------------------------------------------------------
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks, content validation and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: make check
        run: make check

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the five researcher journeys
        run: npm run test:browser

      - name: Upload traces when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
