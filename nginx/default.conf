# ---------------------------------------------------------------------------
# Knowledge Navigator web server.
#
# Serves the static Docusaurus build and proxies /api/ to the API container.
# The API port is never published; this proxy is the only way to reach it, so
# the browser always talks to a single origin.
# ---------------------------------------------------------------------------

server {
    # The unprivileged nginx image runs as a non-root user and cannot bind 80.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Liveness for the container health check: answers without reaching the API.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve the API at request time through Docker's embedded DNS rather
        # than at start-up, so restarting the API does not require restarting
        # this container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Generation on a local model can be slow. The API enforces its own
        # timeout; this one sits comfortably outside it.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # The API sets its own security headers. Repeating them here would
        # send each one twice, which some browsers treat as a conflict, so
        # only caching is decided at this layer.
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build output can be cached indefinitely.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Docusaurus emits directory-style routes as <route>/index.html. Serving
    # that file directly avoids a trailing-slash redirect on every page, and
    # ending with `=404` means an unknown path really is a 404 rather than the
    # 404 page delivered with a 200.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }
}
