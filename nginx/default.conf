# ---------------------------------------------------------------------------
# Knowledge Navigator web server.
#
# Serves the static Docusaurus build and proxies /api/ to the API container.
# The API port is never published; this proxy is the only way to reach it, so
# the browser always talks to a single origin.
# ---------------------------------------------------------------------------

server {
    # The unprivileged nginx image runs as a non-root user and cannot bind 80.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The site loads no external font, script, style, image or connection, so
    # the policy can say exactly that. Docusaurus inlines a small colour-mode
    # script and some critical styles, which is why 'unsafe-inline' appears for
    # scripts and styles and nowhere else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    # Liveness for the container health check: answers without reaching the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve the API at request time through Docker's embedded DNS rather
        # than at start-up, so a restart of the API container does not require a
        # restart of this one.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Generation on a local model can be slow; the API enforces its own
        # timeout, and this one sits comfortably outside it.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # A failed API must not be cached as if it were an answer.
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build output can be cached indefinitely.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # HTML is cheap and must never go stale after a rebuild.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
