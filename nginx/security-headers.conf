# Security headers for everything this server produces itself.
#
# nginx does not merge add_header across levels: a location that declares any
# add_header of its own drops every inherited one. This snippet is therefore
# included in each location rather than set once on the server, which is the
# only arrangement that actually delivers the headers.
#
# The site loads no external font, script, style, image or connection, so the
# policy says exactly that. Docusaurus inlines a small colour-mode script and
# some critical CSS, which is the only reason 'unsafe-inline' appears.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
