# This file is EDITORIAL STRUCTURE, not knowledge. A candidate is a label and
# at most an editorial note: a lead for a page that does not exist yet. It is
# never canonical, never evidence, and never grounds an assistant answer. The
# schema has no field for a factual summary, and adding one is rejected.
#
# Areas, categories and labels come from Appendix A and are frozen. Empty
# categories are deliberate: an unexplained neighbourhood should stay visible.
